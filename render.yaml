# The server of the human-designer study (study/README.md) as a free Render web service.
# Render generates STUDY_SECRET, from which every participant link is made (do not change it during the study), and
# STUDY_ADMIN_KEY, which opens /admin.  Durable storage of the answers needs STUDY_GITHUB_REPO and STUDY_GITHUB_TOKEN,
# set by hand under Environment.  An uptime monitor requests /healthz every 5 minutes so that the instance does not sleep.
services:
  - type: web
    name: cert3nf
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r study/requirements.txt
    startCommand: python study/code/server.py
    healthCheckPath: /healthz
    autoDeployTrigger: commit
    buildFilter:
      paths:
        - study/code/**
        - study/blocks/**
        - study/prebuilt/**
        - study/docs/**
        - study/requirements.txt
        - confirm/*.py
        - e2/e2_tpch.py
        - o3_lossiness_check.py
        - sensitivity_bruteforce.py
        - baselines.py
        - render.yaml
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: STUDY_SECRET
        generateValue: true
      - key: STUDY_ADMIN_KEY
        generateValue: true

<svg xmlns="http://www.w3.org/2000/svg" width="440" height="72" viewBox="0 0 440 72" role="img" aria-label="Try the live demo at cert3nf.onrender.com">
  <title>Try the live demo at cert3nf.onrender.com</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34b85a"/>
      <stop offset="1" stop-color="#1a7f37"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card"><rect x="1" y="4" width="438" height="60" rx="14"/></clipPath>
    <filter id="shadow" x="-5%" y="-20%" width="110%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="2.5" flood-color="#0b3d1c" flood-opacity="0.3"/>
    </filter>
  </defs>
  <style>
    .ring  { transform-box: fill-box; transform-origin: center; animation: ping 1.8s ease-out infinite; }
    .sweep { animation: sweep 3.6s ease-in-out infinite; }
    .arrow { animation: nudge 1.2s ease-in-out infinite; }
    .t1 { font: 700 19px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #fff; }
    .t2 { font: 400 12.5px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #e6f6ea; }
    .live { font: 700 9.5px "Segoe UI", -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; fill: #1a7f37; letter-spacing: 1px; }
    @keyframes ping  { 0% { transform: scale(1); opacity: 0.85; } 80%, 100% { transform: scale(2.6); opacity: 0; } }
    @keyframes sweep { 0%, 55% { transform: translateX(-160px); } 100% { transform: translateX(520px); } }
    @keyframes nudge { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(4px); } }
    @media (prefers-reduced-motion: reduce) { .ring, .sweep, .arrow { animation: none; } .ring { opacity: 0; } }
  </style>
  <g filter="url(#shadow)">
    <rect x="1" y="4" width="438" height="60" rx="14" fill="url(#bg)"/>
  </g>
  <g clip-path="url(#card)">
    <g class="sweep"><rect x="0" y="0" width="120" height="72" fill="url(#shine)" transform="skewX(-20)"/></g>
  </g>
  <!-- live indicator: a white pill with a pulsing dot -->
  <rect x="18" y="24" width="52" height="20" rx="10" fill="#fff"/>
  <circle class="ring" cx="30" cy="34" r="4.5" fill="#2da44e"/>
  <circle cx="30" cy="34" r="4.5" fill="#2da44e"/>
  <text class="live" x="38.5" y="37.6">LIVE</text>
  <text class="t1" x="84" y="32">Try the live demo</text>
  <text class="t2" x="84" y="51">Answer the questions of Cert3NF in your browser</text>
  <!-- play arrow in a circle -->
  <circle cx="408" cy="34" r="16" fill="#fff" fill-opacity="0.18" stroke="#fff" stroke-opacity="0.55"/>
  <g class="arrow">
    <path d="M403 26.5 L415.5 34 L403 41.5 Z" fill="#fff"/>
  </g>
</svg>
